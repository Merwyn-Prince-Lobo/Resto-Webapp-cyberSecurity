{% extends "base.html" %}

{% block title %}Register - Restaurant Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Join our restaurant community</p>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Choose a username" autocomplete="username"
                       pattern="[a-zA-Z0-9_-]+" title="Letters, numbers, underscore and hyphen only">
                <small>Only letters, numbers, underscore, and hyphen allowed</small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Choose a strong password" autocomplete="new-password"
                       minlength="6">
                <small>Minimum 6 characters</small>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>

        <div class="auth-links">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
